<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Python RAG Asistanı</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95, #7e22ce);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chat-container {
    width: 480px;
    height: 640px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
.chat-header {
    position: relative;
    background: linear-gradient(135deg, #7e22ce, #a855f7);
    color: white;
    padding: 20px;
    text-align: center;
  }
  .chat-header h1 { font-size: 18px; }
  .chat-header p { font-size: 12px; opacity: 0.85; margin-top: 4px; }
  .chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #f8f7fc;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #7e22ce, #a855f7);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: #ece9f4;
    color: #2d2a3d;
    border-bottom-left-radius: 4px;
  }
  .msg.bot .score {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    color: #8b8496;
  }
.confidence-bar-container {
    width: 100%;
    height: 6px;
    background: #ddd;
    border-radius: 3px;
    margin-top: 6px;
    overflow: hidden;
  }
  .confidence-bar {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s;
  }
  .chat-input {
    display: flex;
    padding: 14px;
    border-top: 1px solid #eee;
    background: white;
  }
  .chat-input input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
  }
  .chat-input input:focus { border-color: #a855f7; }
  .chat-input button {
    margin-left: 8px;
    background: linear-gradient(135deg, #7e22ce, #a855f7);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
  }
  .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }
  .typing { font-size: 13px; color: #999; font-style: italic; padding: 4px 14px; }
body.dark { background: linear-gradient(135deg, #0f0f0f, #1a1a1a, #262626); }
body.dark .chat-container { background: #1e1e1e; }
body.dark .chat-messages { background: #181818; }
body.dark .msg.bot { background: #2a2a2a; color: #e0e0e0; }
body.dark .chat-input { background: #1e1e1e; border-top-color: #333; }
body.dark .chat-input input { background: #2a2a2a; color: white; border-color: #444; }
.theme-toggle {
  position: absolute;
  top: 16px;
  right: 16px;
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  border-radius: 12px;
  padding: 6px 10px;
  cursor: pointer;
  font-size: 12px;
}
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
  <button class="theme-toggle" onclick="toggleTheme()">🌙 Tema</button>
    <h1>🐍 Python RAG Asistanı</h1>
    <p>Foundry Local ile yerel çalışan yapay zeka</p>
  </div>
  <div class="chat-messages" id="messages">
    <div class="msg bot">Merhaba! Python hakkında bana soru sorabilirsin.</div>
  </div>
  <div class="chat-input">
    <input type="text" id="input" placeholder="Bir soru yaz..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">Gönder</button>
    <button id="exportBtn" onclick="exportChat()" style="margin-left:8px; background:#666;">İndir</button>
    <button id="quizBtn" onclick="startQuiz()" style="margin-left:8px; background:#059669;">Quiz</button>
  </div>
</div>

<script>
let conversationHistory = [];
const messagesDiv = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

function typeWriter(element, text, speed, callback) {
  let i = 0;
  function step() {
    if (i < text.length) {
      element.textContent += text.charAt(i);
      i++;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      setTimeout(step, speed);
    } else if (callback) {
      callback();
    }
  }
  step();
}

function addMessage(text, sender, score, source) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  messagesDiv.appendChild(div);

  if (sender === "bot") {
    typeWriter(div, text, 15, () => {
      if (source) {
        const sourceSpan = document.createElement("span");
        sourceSpan.className = "score";
        sourceSpan.style.display = "block";
        sourceSpan.textContent = "Kaynak: " + source;
        div.appendChild(sourceSpan);
      }
    if (score !== undefined) {
        const scoreSpan = document.createElement("span");
        scoreSpan.className = "score";
        scoreSpan.textContent = "benzerlik skoru: " + score;
        div.appendChild(scoreSpan);

        const barContainer = document.createElement("div");
        barContainer.className = "confidence-bar-container";
        const bar = document.createElement("div");
        bar.className = "confidence-bar";
        const percent = Math.min(Math.max(score * 100, 5), 100);
        bar.style.width = percent + "%";
        if (score >= 0.7) {
          bar.style.background = "#22c55e";
        } else if (score >= 0.4) {
          bar.style.background = "#eab308";
        } else {
          bar.style.background = "#ef4444";
        }
        barContainer.appendChild(bar);
        div.appendChild(barContainer);
const feedbackDiv = document.createElement("div");
      feedbackDiv.style.marginTop = "6px";
      const likeBtn = document.createElement("button");
      likeBtn.textContent = "👍";
      likeBtn.style.cssText = "border:none;background:none;cursor:pointer;font-size:14px;margin-right:8px;";
      likeBtn.onclick = () => sendFeedback("like", feedbackDiv);
      const dislikeBtn = document.createElement("button");
      dislikeBtn.textContent = "👎";
      dislikeBtn.style.cssText = "border:none;background:none;cursor:pointer;font-size:14px;";
      dislikeBtn.onclick = () => sendFeedback("dislike", feedbackDiv);
      feedbackDiv.appendChild(likeBtn);
      feedbackDiv.appendChild(dislikeBtn);
      div.appendChild(feedbackDiv);
      }
    });
  } else {
    div.textContent = text;
  }

  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

async function sendMessage() {
const text0 = input.value.trim().toLowerCase();
  if (text0 === "cevabi goster" && currentQuizAnswer) {
    addMessage(input.value.trim(), "user");
    input.value = "";
    addMessage("Dogru cevap: " + currentQuizAnswer, "bot", undefined, undefined);
    currentQuizAnswer = null;
    return;
  }
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";
  sendBtn.disabled = true;

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.id = "typingIndicator";
  typing.textContent = "Yazıyor...";
  messagesDiv.appendChild(typing);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: conversationHistory })
    });
    const data = await res.json();
    document.getElementById("typingIndicator").remove();
    addMessage(data.answer, "bot", data.score, data.source);

    conversationHistory.push(text);
    if (conversationHistory.length > 4) {
      conversationHistory = conversationHistory.slice(-4);
    }
  } catch (err) {
    document.getElementById("typingIndicator").remove();
    addMessage("Bir hata oluştu, sunucuyu kontrol et.", "bot");
  }
  sendBtn.disabled = false;
  input.focus();
}
function exportChat() {
  const messages = document.querySelectorAll(".msg");
  let text = "Python RAG Asistani - Sohbet Kaydi\n";
  text += "=".repeat(40) + "\n\n";
  messages.forEach(msg => {
    const sender = msg.classList.contains("user") ? "Kullanici" : "Asistan";
    const content = msg.childNodes[0].textContent;
    text += sender + ": " + content + "\n\n";
  });
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "sohbet-kaydi.txt";
  a.click();
  URL.revokeObjectURL(url);
}
let currentQuizAnswer = null;

async function startQuiz() {
  const res = await fetch("/api/quiz");
  const data = await res.json();
  currentQuizAnswer = data.answer;
  addMessage("📝 Quiz zamani! Su konuyu kendi cumlelerinle aciklamayi dene:\n\n\"" + data.topic + "\"\n\nHazir oldugunda 'Cevabı Göster' yazip gonder.", "bot");
}
async function sendFeedback(vote, container) {
  await fetch("/api/feedback", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ vote: vote })
  });
  container.textContent = vote === "like" ? "Teşekkürler! 👍" : "Geri bildirim için teşekkürler 👎";
}
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});
function toggleTheme() {
  document.body.classList.toggle("dark");
  localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
}

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
}
</script>

</body>
</html>
